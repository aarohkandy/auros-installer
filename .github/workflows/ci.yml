name: ci

# This repository cannot be compiled on the machine it was written on: the
# authoring environment has no Go toolchain. CI is therefore not a convenience
# here, it is the only execution environment (DECISIONS.md D5). Nothing in this
# repo should be described as "building" until this workflow has been green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 1.25.14, not 1.23, because of two vulnerabilities this code actually
  # reaches, both found by govulncheck the first time it was able to run:
  #
  #   GO-2026-4602  os   "FileInfo can escape from a Root"  fixed in 1.25.8
  #                 traced through filepath.WalkDir -> os.ReadDir, which is how
  #                 this tool enumerates a stranger's Documents folder. A
  #                 path-escape bug in the standard library of a program whose
  #                 own quarantine has a ReasonPathEscape is not a footnote.
  #   GO-2026-4971  net                                      fixed in 1.25.10
  #                 traced through testharness/runner's QMP socket.
  #
  # Pinned EXACTLY rather than "1.25" + latest: the toolchain is part of the
  # evidence, and a harness whose REPORT.md an auditor re-executes must not
  # change compiler between the run that produced it and the run that checks
  # it. A new CVE turns govulncheck red, and the bump is then a visible commit.
  #
  # go.mod still says `go 1.23`: that is the LANGUAGE floor and it does not
  # move. This is the toolchain the shipped exe is built with, which is the
  # thing that carries the fix. Windows support is unchanged — 1.21 dropped
  # Windows 7/8, long before this floor, and 1.25 targets Windows 10+ on both
  # amd64 and 386 exactly as 1.23 did.
  GO_VERSION: "1.25.14"

defaults:
  run:
    # D19: a pipe through tail/head/tee takes the LAST command\'s exit status, so a failing
    # build can score as a passing step. That happened here once; it does not happen again.
    shell: bash -euo pipefail {0}

jobs:
  check:
    name: vet, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # gofmt -l must print nothing. The diff is printed first so a failure is
        # a patch you can apply rather than a list of filenames.
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::group::gofmt diff"
            gofmt -d .
            echo "::endgroup::"
            echo "these files are not gofmt-clean:"
            gofmt -l .
            exit 1
          fi

      - name: go test -race
        # -race because the copy engine reports progress and quarantines files
        # from several goroutines, and a data race in the thing that decides
        # whether the archive is complete is the worst possible place for one.
        # -count=1 to defeat the test cache: a safety suite that did not
        # actually run is worse than no suite.
        run: go test ./... -race -count=1 -v

      - name: assert the abort path is tested more than the happy path
        # SAFETY.md rule 2: "if the ratio of abort tests to happy tests ever
        # drops below 1:1, the suite has regressed."
        #
        # Matching on test names is approximate, so this prints both lists: a
        # failure here should be read, not silenced by widening the pattern.
        run: |
          pat='Refus|Reject|Abort|Cancel|Mismatch|Corrupt|Truncat|Missing|Full|Escap|Disappear|Change|Fail|Unreadable|Collide|Collision|TooLarge|OutOfOrder|Unknown|Breach|Wall|Cannot|Quarantin|Block|Never|Retry|Waiv|Stale|Sweep|Untouched|CompiledOut|NotValidated|Wrong|DryRun|Zero|Malformed|Impossible|Duplicate'
          grep -rhoE '^func Test[A-Za-z0-9_]+' --include='*_test.go' . | sed 's/^func //' | sort -u > /tmp/all.txt
          grep -E "Test[A-Za-z0-9_]*($pat)" /tmp/all.txt | sort -u > /tmp/abort.txt || true
          total=$(wc -l < /tmp/all.txt)
          abort=$(wc -l < /tmp/abort.txt)
          echo "abort-path tests: $abort of $total"
          echo "::group::abort-path tests"; cat /tmp/abort.txt; echo "::endgroup::"
          echo "::group::everything else"; comm -23 /tmp/all.txt /tmp/abort.txt; echo "::endgroup::"
          if [ "$abort" -lt 1 ]; then echo "no abort-path tests found"; exit 1; fi
          if [ "$((abort * 2))" -lt "$total" ]; then
            echo "FAIL: fewer than half the tests exercise an abort path (SAFETY.md rule 2)."
            echo "Add abort tests. Do not widen the pattern."
            exit 1
          fi

  testharness:
    name: testharness (nested module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # testharness/ IS ITS OWN GO MODULE (testharness/go.mod), so the `check`
      # job's `go build ./...` at the repository root does not reach it — a root
      # module deliberately excludes nested ones. That is how the runner came to
      # be shipped in a state where it did not compile at all (`v.stderr
      # undefined`, twice) while README.md described its behaviour in the
      # present tense. The evidence-producing half of the most dangerous thing
      # Auros builds had never been through a compiler.
      #
      # This job is that gap closed. It is not optional and it is not allowed to
      # fail: a harness that does not build produces no evidence, and a README
      # that describes what it enforces is then an untested assertion.
      - name: go build
        working-directory: testharness
        run: go build ./...

      - name: go vet
        working-directory: testharness
        run: go vet ./...

      - name: gofmt
        working-directory: testharness
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::group::gofmt diff"; gofmt -d .; echo "::endgroup::"
            gofmt -l .
            exit 1
          fi

      - name: go test -race
        # Every test in here is an attack that once worked against this harness:
        # an installer that writes nothing to the destination and scores 100/100,
        # a suite where forty runs never started and reports "60/60", a
        # hand-written result.json counted as a clean pass, a hung installer
        # scored as a clean abort. -count=1 defeats the test cache, because a
        # safety suite that did not actually run is worse than no suite.
        working-directory: testharness
        run: go test ./... -race -count=1 -v

      # gen, faultagent and bootbeacon run INSIDE the Windows guest. Their
      # Windows-only files (gen/plat_windows.go, fault/agent_windows.go,
      # runner/cmd/bootbeacon/evidence_windows.go) are never compiled by the
      # Linux job above, so this is the only place they are type-checked at all.
      # 386 as well as amd64: some of the 2012-2018 machines this product exists
      # for boot a 32-bit Windows.
      - name: cross-compile the guest binaries
        working-directory: testharness
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 386; do
            echo "── windows/$arch ──"
            GOARCH=$arch go build -trimpath -o /tmp/gen-$arch.exe        ./gen
            GOARCH=$arch go build -trimpath -o /tmp/faultagent-$arch.exe ./fault/cmd/faultagent
            GOARCH=$arch go build -trimpath -o /tmp/bootbeacon-$arch.exe ./runner/cmd/bootbeacon
            GOARCH=$arch go vet ./...
          done

  prove-red:
    name: prove-red (the checks are watched failing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # DECISIONS.md D34 and D37. A green suite cannot tell you that its
      # assertions would disagree with WRONG code, and this repository has
      # already shipped three permanently-green checks and one aggregate gate
      # that reported PASS on failing suites.
      #
      # tools/prove-red.sh reintroduces one specific defect at a time into a
      # scratch copy and requires the suite that owns it to go red FOR THE
      # STATED REASON — so a mutation that breaks the build incidentally is not
      # scored as a catch.
      #
      # This job is not optional and it is not allowed to be skipped. A
      # mutation that stops being caught means an assertion has gone vacuous,
      # and the fix is the assertion, never the mutation.
      - name: prove every check can fail
        run: tools/prove-red.sh

  dbus-e2e:
    name: the desktop notification, against a real session bus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # internal/deskbus's unit tests drive a fake bus built out of deskbus's
      # OWN encoder. That proves the client is self-consistent and nothing
      # else: if the D-Bus alignment rules are misunderstood, both halves
      # misunderstand them identically and the suite is green while no real
      # desktop ever shows the notification.
      #
      # This job is the independent decoder. A real dbus-daemon parses the
      # header and a real org.freedesktop.Notifications service, through
      # libdbus's own marshaller, decodes the body against the signature.
      - name: install a session bus and a notification service
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus python3-dbus python3-gi

      - name: send a notification through a real bus
        run: tools/dbus-e2e/run.sh

      # run.sh exits 0 when the tooling is absent, which is right for a
      # laptop and wrong for CI: a job that silently proves nothing is the
      # thing this repository keeps finding in its own code. Here the tooling
      # was just installed, so its absence is a broken job.
      - name: assert the job actually ran the test
        run: |
          tools/dbus-e2e/run.sh 2>&1 | tee /tmp/e2e.log
          grep -q "decoded by libdbus" /tmp/e2e.log || {
            echo "the end-to-end notification test did not run; this job proved nothing"
            exit 1
          }

  build-linux:
    name: build linux/amd64 (the restore)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The Linux half of the migration. Static, no cgo, no external modules:
      # it is copied into the bootc image at /usr/libexec/auros/auros-restore
      # and has to run on whatever glibc that image ships.
      - name: build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/auros-restore-linux-amd64 ./cmd/auros-restore
          ls -l dist

      - name: it must run and refuse politely with no archive attached
        # A smoke test that is a real assertion: with no archive anywhere, the
        # exit status is 0 and nothing scary is printed, because a fresh Auros
        # laptop that was never migrated must not warn its owner about a backup
        # they never made. --require-archive flips that, and is what the image
        # build uses to prove the binary works at all.
        run: |
          out="$(dist/auros-restore-linux-amd64 --archive /nonexistent --require-archive 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "no archive" || {
            echo "the refusal does not say what is wrong"; exit 1; }
          dist/auros-restore-linux-amd64 --archive /nonexistent --require-archive && {
            echo "--require-archive returned 0 with no archive"; exit 1; } || true

      - uses: actions/upload-artifact@v4
        with:
          name: auros-restore-linux-amd64
          path: dist/auros-restore-linux-amd64
          if-no-files-found: error
          retention-days: 30

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # This used to be golang/govulncheck-action@v1, and it could not install
      # its own tool: the action pins GOTOOLCHAIN=local and then runs
      # `go install golang.org/x/vuln/cmd/govulncheck@latest`, so the day x/vuln
      # started requiring go >= 1.26 the job began failing with a toolchain
      # error before it had looked at a single package. A security gate that is
      # red for a reason unrelated to security is a gate people learn to scroll
      # past, and this one was red for exactly that reason.
      #
      # GOTOOLCHAIN=auto applies to BUILDING THE TOOL only. The analysis still
      # runs against GO_VERSION above, which is the toolchain the shipped exe is
      # built with and therefore the one whose standard library is the answer.
      # `go install pkg@version` runs outside this module, so go.mod stays
      # dependency-free (D-series: zero third-party dependencies).
      - name: install govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (root module)
        run: govulncheck ./...

      # testharness/ is its own module, so ./... above does not reach it.
      - name: govulncheck (testharness module)
        working-directory: testharness
        run: govulncheck ./...

  build-windows:
    name: build windows/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # 386 is not legacy decoration. The machines this runs on are from
        # 2012-2018 and some of them boot a 32-bit Windows.
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # No cgo, no external modules: one static exe with no runtime
        # dependency and no installer of its own (SPEC §6C).
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/auros-migrate-windows-${{ matrix.goarch }}.exe \
            ./cmd/auros-migrate
          ls -l dist

      - name: vet the windows build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # internal/winenv's Win32 surface and internal/sysdisk's armed path are
        # behind build tags, so they are never compiled by the Linux test job.
        # This is the only place they are type-checked at all.
        run: go vet ./...

      - name: compile the armed build too, without shipping it
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # The privileged system-disk code is compiled out of every artifact this
        # workflow publishes. It still has to COMPILE, or it rots unnoticed
        # until the day somebody enables it. Built to a throwaway path and never
        # uploaded.
        run: go build -tags auros_arm_enabled -o /tmp/armed-never-shipped.exe ./cmd/auros-migrate

      - name: assert the shipped exe is not the armed build
        run: |
          if [ ! -f dist/auros-migrate-windows-${{ matrix.goarch }}.exe ]; then
            echo "no artifact was produced"; exit 1
          fi
          if [ -f dist/armed-never-shipped.exe ]; then
            echo "FAIL: an armed binary is in the artifact directory"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: auros-migrate-windows-${{ matrix.goarch }}
          path: dist/auros-migrate-windows-${{ matrix.goarch }}.exe
          if-no-files-found: error
          retention-days: 30
