# TEMPORARY PROBE — measures the hosted Windows runner before the Gate 3 harness is built on it.
name: gate3
on:
  workflow_dispatch:
    inputs:
      clean_runs: { description: 'unused in probe', default: '100', type: string }
  push:
    paths: ['internal/**', 'cmd/**', 'testharness/**', '.github/workflows/gate3.yml']
defaults:
  run:
    shell: pwsh
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Identity, elevation, sessions
        run: |
          $ErrorActionPreference = 'Continue'
          whoami; whoami /groups | Select-String -Pattern 'Mandatory|Administrators'
          whoami /priv
          "session: $((Get-Process -Id $PID).SessionId)"
          "EnableLUA: $((Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System).EnableLUA)"
          "ConsentPromptBehaviorAdmin: $((Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System).ConsentPromptBehaviorAdmin)"
          Get-ChildItem env: | Where-Object { $_.Name -match 'RUNNER|GITHUB_WORKSPACE|ImageOS|ImageVersion|TEMP|TMP|USERPROFILE|LOCALAPPDATA|APPDATA|SystemDrive|PROCESSOR|NUMBER_OF' } | Format-Table -AutoSize | Out-String -Width 300
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, TotalVisibleMemorySize, FreePhysicalMemory | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory | Format-List
          Get-Process -Name Runner.Worker, Runner.Listener -ErrorAction SilentlyContinue | Select-Object Name, Id, Path, SessionId | Format-Table -AutoSize | Out-String -Width 300
          Get-Service seclogon, Schedule, WinDefend, SysMain, wsearch -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType -AutoSize
      - name: Disks and volumes
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Volume | Format-Table DriveLetter, FileSystemLabel, FileSystem, DriveType, Size, SizeRemaining -AutoSize | Out-String -Width 300
          Get-Disk | Format-Table Number, FriendlyName, Size, PartitionStyle, IsBoot, IsSystem, BusType -AutoSize | Out-String -Width 300
          mountvol
          fsutil usn queryjournal C:
          fsutil behavior query disablelastaccess
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' -ErrorAction SilentlyContinue) | Format-List
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Get-MpPreference -ErrorAction SilentlyContinue | Select-Object -ExpandProperty ExclusionPath
      - name: VHD create on the temp disk, local user, CreateProcessWithLogon
        run: |
          $ErrorActionPreference = 'Continue'
          $vhd = "$env:RUNNER_TEMP\probe.vhdx"
          "create vdisk file=`"$vhd`" maximum=2000 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk`ncreate partition primary`nformat fs=ntfs quick label=PROBE`nassign letter=P" | Out-File -Encoding ascii "$env:RUNNER_TEMP\mk.txt"
          Measure-Command { diskpart /s "$env:RUNNER_TEMP\mk.txt" | Out-Host } | Select-Object TotalSeconds
          Get-Volume -DriveLetter P | Format-List
          mountvol P: /L
          icacls P:\
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 24 | ForEach-Object {[char]$_}) + '!Aa1'
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name gate3probe -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member gate3probe
          $cred = New-Object System.Management.Automation.PSCredential('gate3probe', $sec)
          try {
            $p = Start-Process -FilePath cmd.exe -ArgumentList '/c','whoami /groups > P:\who.txt 2>&1 & echo %USERPROFILE% >> P:\who.txt & echo %LOCALAPPDATA% >> P:\who.txt' -Credential $cred -LoadUserProfile -Wait -PassThru -WorkingDirectory C:\
            "exit: $($p.ExitCode)"
          } catch { "Start-Process -Credential FAILED: $_" }
          Get-Content P:\who.txt -ErrorAction SilentlyContinue
          Get-ChildItem C:\Users -Force | Format-Table Name, LastWriteTime -AutoSize
          Get-ChildItem C:\Users\gate3probe -Force -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum | Select-Object Count, Sum
          Get-ChildItem C:\Users\gate3probe -Force -ErrorAction SilentlyContinue | Format-Table Name, Length, Attributes -AutoSize
      - name: How long does a naive C:\ enumeration take
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          $t = Measure-Command { $script:n = (Get-ChildItem C:\ -Recurse -Force -File -ErrorAction SilentlyContinue | Measure-Object).Count }
          "files on C: = $n in $($t.TotalSeconds) s"
